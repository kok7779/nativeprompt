[project]
name = "nativeprompt"
version = "0.1.0"
description = "Переписывает промпт под правила модели, где вы работаете (Claude Opus 5.5, Fable 5.1, GPT-6 Astra/Sol/Luna, Codex), и подсказывает, на каком уровне усилий её запускать. Каждый совет со ссылкой на официальную документацию. Без API-ключей, без зависимостей, офлайн."
requires-python = ">=3.10"
